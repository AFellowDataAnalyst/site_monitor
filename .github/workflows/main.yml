name: NAO Monitor
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check NAO image
        run: |
          HASH=$(curl -s https://radar.weather.gov/ridge/standard/CONUS_loop.gif | md5sum | awk '{print $1}')
          PREV=$(cat last_hash.txt 2>/dev/null || echo "none")

          if [ "$HASH" != "$PREV" ] && [ "$PREV" != "none" ]; then
            curl -d "NAO forecast updated!" https://ntfy.sh/nao_gfs_1218
          fi

          echo "$HASH" > last_hash.txt

      - uses: stefanzweifel/git-auto-commit-action@v5
