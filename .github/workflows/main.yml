name: NAO Monitor
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check NAO image
        run: |
          HASH=$(curl -s https://www.cpc.ncep.noaa.gov/products/precip/CWlink/pna/nao.gefs.sprd2.png | md5sum | awk '{print $1}')
          PREV=$(cat last_hash.txt 2>/dev/null || echo "none")

          if [ "$HASH" != "$PREV" ] && [ "$PREV" != "none" ]; then
            curl -H "Attach: https://www.cpc.ncep.noaa.gov/products/precip/CWlink/pna/nao.gefs.sprd2.png" -d "NAO forecast updated!" https://ntfy.sh/nao_gfs_1218
          fi

          echo "$HASH" > last_hash.txt

      - uses: stefanzweifel/git-auto-commit-action@v5
